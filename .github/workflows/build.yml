name: Build Kernel C40

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y git bc bison build-essential libssl-dev libncurses-dev flex python3 gcc-aarch64-linux-gnu

      - name: Limpeza Profunda e Compilação
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # 1. Limpeza obrigatória para evitar "source tree is not clean"
          make mrproper
          rm -rf out/
          mkdir -p out/
          
          # 2. Busca automática da configuração correta
          # Prioriza arquivos com 'frost' ou 'jlq', caso contrário usa o primeiro defconfig encontrado
          DEFCONFIG=$(find arch/arm64/configs/ -name "*frost*defconfig" -o -name "*jlq*defconfig" | head -n 1)
          if [ -z "$DEFCONFIG" ]; then
            DEFCONFIG=$(find arch/arm64/configs/ -name "*defconfig*"
