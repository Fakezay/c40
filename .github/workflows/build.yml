name: Build Kernel C40 (Docker Configs)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Construção no Ambiente Isolado (Docker Ubuntu 18.04)
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace ubuntu:18.04 /bin/bash -c "
            echo '=== Iniciando ambiente limpo no Ubuntu 18.04 ==='
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y git bc bison flex libssl-dev make libc6-dev libncurses5-dev gcc-aarch64-linux-gnu build-essential python3
            
            export ARCH=arm64
            export SUBARCH=arm64
            export CROSS_COMPILE=aarch64-linux-gnu-
            
            echo '=== Executando limpeza profunda ==='
            make mrproper
            make clean
            rm -rf out/
            mkdir -p out/
            
            echo '=== Injetando Configurações para Docker no defconfig ==='
            # Identificamos qual defconfig o seu sistema usa e injetamos as flags obrigatórias para o Docker
            DEFCONFIG_FILE=arch/arm64/configs/frost_defconfig
            if [ ! -f \$DEFCONFIG_FILE ]; then
               DEFCONFIG_FILE=arch/arm64/configs/gki_defconfig
            fi
            
            cat << 'EOF' >> \$DEFCONFIG_FILE
            # Requisitos base de Containers
            CONFIG_NAMESPACES=y
            CONFIG_NET_NS=y
            CONFIG_PID_NS=y
            CONFIG_IPC_NS=y
            CONFIG_UTS_NS=y
            CONFIG_USER_NS=y
            
            # Controle de Recursos (Cgroups)
            CONFIG_CGROUPS=y
            CONFIG_CGROUP_CPUACCT=y
            CONFIG_CGROUP_DEVICE=y
            CONFIG_CGROUP_FREEZER=y
            CONFIG_CGROUP_SCHED=y
            CONFIG_CPUSETS=y
            CONFIG_MEMCG=y
            CONFIG_MEMCG_SWAP=y
            
            # Redes e Roteamento Docker
            CONFIG_VETH=y
            CONFIG_BRIDGE=y
            CONFIG_BRIDGE_NETFILTER=y
            CONFIG_NF_NAT=y
            CONFIG_IP_NF_FILTER=y
            CONFIG_IP_NF_TARGET_MASQUERADE=y
            CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
            CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
            
            # Sistema de Arquivos em Camadas (Fundamental)
            CONFIG_OVERLAY_FS=y
            EOF
            
            echo '=== Configurando o Kernel ==='
            make O=out ARCH=arm64 \$(basename \$DEFCONFIG_FILE)
            
            echo '=== Neutralizando TEE ==='
            sed -i 's/CONFIG_MICROTRUST_TEE_VERSION=.*/CONFIG_MICROTRUST_TEE_VERSION=\"\"/g' out/.config || true
            
            echo '=== Iniciando Compilação ==='
            make O=out ARCH=arm64 V=1 KBUILD_WERROR=0 -j2
          "

      - name: Listar arquivos gerados
        if: success()
        run: |
          echo "=== Verificando o que foi gerado na pasta boot ==="
          ls -la out/arch/arm64/boot/ || echo "Pasta boot não existe. Verificando raiz do out..."
          ls -la out/ | grep -i image || true

      - name: Upload Kernel Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Poco-C40-Docker
          # Usamos Image* para pegar Image, Image.gz, Image.gz-dtb, etc.
          path: out/arch/arm64/boot/Image*
