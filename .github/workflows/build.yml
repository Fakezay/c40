name: Build Kernel C40 (Docker Configs)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Criar Script de Compilação
        run: |
          # Criamos o script do lado de fora do Docker para evitar erros de sintaxe
          cat << 'SCRIPT' > build_kernel.sh
          #!/bin/bash
          set -e # Aborta no primeiro erro real
          
          echo '=== Iniciando ambiente limpo no Ubuntu 18.04 ==='
          apt-get update
          # AQUI FOI ADICIONADO O PACOTE 'cpio' NO FINAL DA LISTA
          DEBIAN_FRONTEND=noninteractive apt-get install -y git bc bison flex libssl-dev make libc6-dev libncurses5-dev gcc-aarch64-linux-gnu build-essential python3 cpio
          
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          echo '=== Executando limpeza profunda ==='
          make mrproper
          make clean
          rm -rf out/
          mkdir -p out/
          
          echo '=== Injetando Configurações para Docker no defconfig ==='
          DEFCONFIG_FILE=arch/arm64/configs/frost_defconfig
          if [ ! -f $DEFCONFIG_FILE ]; then
             DEFCONFIG_FILE=arch/arm64/configs/gki_defconfig
          fi
          
          echo "Adicionando suporte a containers em: $DEFCONFIG_FILE"
          
          # Injeção linha por linha
          echo "CONFIG_NAMESPACES=y" >> $DEFCONFIG_FILE
          echo "CONFIG_NET_NS=y" >> $DEFCONFIG_FILE
          echo "CONFIG_PID_NS=y" >> $DEFCONFIG_FILE
          echo "CONFIG_IPC_NS=y" >> $DEFCONFIG_FILE
          echo "CONFIG_UTS_NS=y" >> $DEFCONFIG_FILE
          echo "CONFIG_USER_NS=y" >> $DEFCONFIG_FILE
          echo "CONFIG_CGROUPS=y" >> $DEFCONFIG_FILE
          echo "CONFIG_CGROUP_CPUACCT=y" >> $DEFCONFIG_FILE
          echo "CONFIG_CGROUP_DEVICE=y" >> $DEFCONFIG_FILE
          echo "CONFIG_CGROUP_FREEZER=y" >> $DEFCONFIG_FILE
          echo "CONFIG_CGROUP_SCHED=y" >> $DEFCONFIG_FILE
          echo "CONFIG_CPUSETS=y" >> $DEFCONFIG_FILE
          echo "CONFIG_MEMCG=y" >> $DEFCONFIG_FILE
          echo "CONFIG_MEMCG_SWAP=y" >> $DEFCONFIG_FILE
          echo "CONFIG_VETH=y" >> $DEFCONFIG_FILE
          echo "CONFIG_BRIDGE=y" >> $DEFCONFIG_FILE
          echo "CONFIG_BRIDGE_NETFILTER=y" >> $DEFCONFIG_FILE
          echo "CONFIG_NF_NAT=y" >> $DEFCONFIG_FILE
          echo "CONFIG_IP_NF_FILTER=y" >> $DEFCONFIG_FILE
          echo "CONFIG_IP_NF_TARGET_MASQUERADE=y" >> $DEFCONFIG_FILE
          echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y" >> $DEFCONFIG_FILE
          echo "CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y" >> $DEFCONFIG_FILE
          echo "CONFIG_OVERLAY_FS=y" >> $DEFCONFIG_FILE
          
          echo '=== Configurando o Kernel ==='
          make O=out ARCH=arm64 $(basename $DEFCONFIG_FILE)
          
          echo '=== Neutralizando TEE ==='
          sed -i 's/CONFIG_MICROTRUST_TEE_VERSION=.*/CONFIG_MICROTRUST_TEE_VERSION=\"\"/g' out/.config || true
          
          echo '=== Iniciando Compilação ==='
          make O=out ARCH=arm64 V=1 KBUILD_WERROR=0 -j1
          SCRIPT
          
          # Dá permissão de execução ao script
          chmod +x build_kernel.sh

      - name: Executar no Ubuntu 18.04 Isolado
        run: |
          # Monta a pasta atual e manda o Docker rodar o arquivo .sh
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace ubuntu:18.04 ./build_kernel.sh

      - name: Listar arquivos gerados
        if: always()
        run: |
          echo "=== Verificando o que foi gerado na pasta boot ==="
          ls -la out/arch/arm64/boot/ || echo "A pasta boot não foi gerada."
          ls -la out/ | grep -i image || true

      - name: Upload Kernel Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Poco-C40-Docker
          path: out/arch/arm64/boot/Image*
